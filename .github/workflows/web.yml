# Compila la app (PWA web) y la publica gratis en GitHub Pages en cada push a main.
# También deja el APK de Android como artefacto descargable.
name: Compilar y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Genera carpetas de plataforma (web/, android/) sin tocar lib/
      - run: |
          set -o pipefail
          flutter create . --platforms=web,android --project-name finca_app --org co.hatoclaros --no-pub 2>&1 | tee salida.txt || { tail -n 10 salida.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: rm -f test/widget_test.dart
      - run: |
          set -o pipefail
          flutter pub get 2>&1 | tee salida.txt || { tail -n 10 salida.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analisis.txt 2>&1 && exit 0
          grep -E "^ *error" analisis.txt | head -n 10 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - run: |
          set -o pipefail
          flutter test 2>&1 | tee salida.txt || { tail -n 10 salida.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: |
          set -o pipefail
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee salida.txt || { tail -n 10 salida.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee salida.txt || { tail -n 10 salida.txt | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: finca-android-apk, path: build/app/outputs/flutter-apk/app-release.apk }
      # El instalador Android queda descargable desde la misma página: /finca-app/finca.apk
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/web/finca.apk
      - run: touch build/web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        continue-on-error: true
        uses: actions/deploy-pages@v4
